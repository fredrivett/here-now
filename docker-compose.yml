services:
  app:
    build: .
    ports:
      - "3210:3210"
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://herenow:herenow@db:5432/herenow
      - DIRECT_URL=postgresql://herenow:herenow@db:5432/herenow
      - ALLOWED_DOMAINS=${ALLOWED_DOMAINS:-localhost}
      - API_BASE_URL=${API_BASE_URL:-}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    environment:
      - POSTGRES_USER=herenow
      - POSTGRES_PASSWORD=herenow
      - POSTGRES_DB=herenow
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U herenow -d herenow"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Run database migrations on startup
  migrate:
    build: .
    command: npx prisma db push --skip-generate
    environment:
      - DATABASE_URL=postgresql://herenow:herenow@db:5432/herenow
      - DIRECT_URL=postgresql://herenow:herenow@db:5432/herenow
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
